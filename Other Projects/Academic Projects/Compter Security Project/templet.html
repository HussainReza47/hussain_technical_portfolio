<!DOCTYPE html>
<html>
<head>
    <title>Online Banking Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
        }

        /* Top bar */
        .header {
            background-color: #b31b1b;
            color: white;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
        }

        /* Center box */
        .container {
            width: 400px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.1);
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            width: 95%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #b31b1b;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #8f1515;
        }

        .links {
            margin-top: 15px;
            font-size: 13px;
        }

        .links a {
            color: #b31b1b;
            text-decoration: none;
            display: block;
            margin-top: 5px;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 12px;
            color: gray;
        }
    </style>
</head>
<body>

<div class="header">
    Online Banking
</div>

<div class="container">
    <h2>Sign On</h2>

    <form action="/login" method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Sign On</button>
    </form>

    <div class="links">
        <a href="#">Forgot Username?</a>
        <a href="#">Forgot Password?</a>
        <a href="#">Enroll Now</a>
    </div>
</div>

<div class="footer">
    © 2026 Secure Online Banking Demo
</div>

</body>
</html>
